<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>قياس المدد</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: #120a2e; color: #fff; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: rgba(255,255,255,.6); font-size: 13px; margin: 0 0 14px; line-height: 1.7; }
    button {
      width: 100%; padding: 14px; border: 0; border-radius: 12px; margin-bottom: 10px;
      font-size: 16px; font-weight: 700; background: #a855f7; color: #fff; cursor: pointer;
    }
    button:disabled { opacity: .5; }
    #status { font-size: 14px; margin-bottom: 10px; }
    .bar { height: 8px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
    .fill { height: 100%; width: 0; background: #ec4899; transition: width .3s; }
    textarea {
      width: 100%; height: 260px; direction: ltr; text-align: left;
      background: #000; color: #9f9; border: 1px solid #333; border-radius: 10px;
      padding: 10px; font-family: monospace; font-size: 12px;
    }
    .warn { color: #f9a8d4; }
  </style>
</head>
<body>
  <h1>قياس مدد الملفات</h1>
  <p>تقرأ هذه الصفحة مدة كل ملف صوتي دون تنزيله كاملًا، وتكتشف اللقاءات الجديدة تلقائيًا. اضغط «ابدأ القياس»، وبعد انتهائه اضغط «نسخ النتيجة» وأرسلها.</p>

  <button id="start">ابدأ القياس</button>
  <div id="status"></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <button id="copy" disabled>نسخ النتيجة</button>
  <textarea id="out" readonly></textarea>

<script>
// روابط النسختين بالنظام نفسه المستخدم في الموقع
const BASES = {
  normal: {
    c: atob('aHR0cHM6Ly9hcmNoaXZlLm9yZy9kb3dubG9hZC93YWx5YXN0YWFmZWZNUDMvV2FseWFzdGFhZmVmXw=='),
    L: atob('aHR0cHM6Ly9hcmNoaXZlLm9yZy9kb3dubG9hZC93YWx5YXN0YWFmZWZNUDMvV2FseWFzdGFhZmVmXw==') + 'LIVE',
  },
  fast: {
    c: atob('aHR0cHM6Ly9hcmNoaXZlLm9yZy9kb3dubG9hZC94V2FseWFzdGFhZmVmTXAzL194V2FseWFzdGFhZmVm'),
    L: atob('aHR0cHM6Ly9hcmNoaXZlLm9yZy9kb3dubG9hZC94V2FseWFzdGFhZmVmTXAzL3hXYWx5YXN0YWFmZWZfTElWRQ=='),
  },
};
const url = (mode, id) => BASES[mode][id[0]] + id.slice(1) + '.mp3';
const pad = (n) => String(n).padStart(2, '0');

// قراءة المدة من بيانات الملف فقط
function measure(src) {
  return new Promise((resolve) => {
    const a = new Audio();
    a.preload = 'metadata';
    let done = false;
    const finish = (v) => {
      if (done) return;
      done = true; clearTimeout(timer);
      a.removeAttribute('src'); a.load();
      resolve(v);
    };
    const timer = setTimeout(() => finish(null), 45000);
    a.addEventListener('loadedmetadata', () => finish(isFinite(a.duration) ? Math.floor(a.duration) : null));
    a.addEventListener('error', () => finish(null));
    a.src = src;
  });
}

async function measureBoth(id) {
  const [normal, fast] = await Promise.all([measure(url('normal', id)), measure(url('fast', id))]);
  return { id, normal, fast };
}

const $ = (id) => document.getElementById(id);

$('start').onclick = async () => {
  $('start').disabled = true;
  $('copy').disabled = true;
  const results = [];
  const ids = ['c01', 'c02', 'c03', 'c04'];
  const KNOWN_LIVE = 32;
  for (let i = 1; i <= KNOWN_LIVE; i++) ids.push('L' + pad(i));

  let doneCount = 0;
  const total = () => ids.length;
  const show = (extra) => {
    $('status').textContent = `تم ${doneCount} من ${total()}` + (extra || '');
    $('fill').style.width = Math.min(100, doneCount / total() * 100) + '%';
  };
  show();

  // القياس على دفعات صغيرة لتخفيف الضغط على الاتصال
  for (let i = 0; i < ids.length; i += 4) {
    const batch = await Promise.all(ids.slice(i, i + 4).map(measureBoth));
    results.push(...batch);
    doneCount += batch.length;
    show();
  }

  // اكتشاف اللقاءات الجديدة بعد آخر لقاء معروف
  let n = KNOWN_LIVE + 1;
  while (n < 99) {
    const id = 'L' + pad(n);
    ids.push(id);
    show(' — البحث عن لقاءات جديدة...');
    const r = await measureBoth(id);
    doneCount++;
    if (r.normal == null && r.fast == null) { ids.pop(); doneCount--; break; }
    results.push(r);
    n++;
  }
  show();

  const missing = results.filter(r => r.normal == null || r.fast == null).map(r => r.id);
  const lines = results.map(r => `${r.id}: normal=${r.normal ?? 'X'} fast=${r.fast ?? 'X'}`);
  $('out').value = lines.join('\n');
  $('status').innerHTML = missing.length
    ? `<span class="warn">انتهى القياس، لكن تعذّر قياس: ${missing.join('، ')}. أرسل النتيجة كما هي.</span>`
    : 'انتهى القياس بنجاح ✓';
  $('start').disabled = false;
  $('start').textContent = 'إعادة القياس';
  $('copy').disabled = false;
};

$('copy').onclick = async () => {
  const text = $('out').value;
  try { await navigator.clipboard.writeText(text); }
  catch (e) { $('out').select(); document.execCommand('copy'); }
  $('copy').textContent = 'تم النسخ ✓';
  setTimeout(() => { $('copy').textContent = 'نسخ النتيجة'; }, 2000);
};
</script>
</body>
</html>
