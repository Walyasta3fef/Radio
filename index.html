// يحفظ الدولة يومًا كاملًا لتقليل الطلبات على الخدمة الخارجية
async function getCountryCode() {
  try {
    const cached = JSON.parse(storage.get('radio_country') || 'null');
    if (cached && cached.code && Date.now() - cached.at < 86400000) return cached.code;
  } catch (e) {}
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    const r = await fetch('https://ipapi.co/json/', { signal: ctrl.signal });
    clearTimeout(timer);
    const d = await r.json();
    if (d && typeof d.country_code === 'string' && /^[A-Z]{2}$/.test(d.country_code)) {
      storage.set('radio_country', JSON.stringify({ code: d.country_code, at: Date.now() }));

  { id: "L30", duration: 2066, title: "لقاء 30 - تقاوم ليه؟ مانت كده كده هتقع!" },
  { id: "L31", duration: 1527, title: "لقاء 31 - هل المسار اللي بيتكون في المخ مش بيموت؟" },
];

function seededShuffle(array, seed) {
  let ci = array.length, tv, ri;
  const rnd = () => { const x = Math.sin(seed++) * 10000; return x - Math.floor(x); };
  while (ci !== 0) { ri = Math.floor(rnd() * ci); ci--; tv = array[ci]; array[ci] = array[ri]; array[ri] = tv; }
  return array;
}

// الترتيب اليومي يُحسب بالتوقيت العالمي ليكون موحّدًا لكل المستمعين في كل الدول
const playlistCache = {};
function getPlaylist(now) {
  const d = new Date(now);
  const seed = d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate();
  if (!playlistCache[seed]) playlistCache[seed] = seededShuffle([...ORIGINAL_PLAYLIST], seed);
  return playlistCache[seed];
}

const RADIO_EPOCH = 1672531200000;
const TOTAL_DURATION = ORIGINAL_PLAYLIST.reduce((s, t) => s + t.duration, 0);

// موضع البث الحي الآن: اللقاء الحالي والتالي والثانية داخل اللقاء
function getRadioState(now = Date.now()) {
  const playlist = getPlaylist(now);
  const pos = Math.floor((now - RADIO_EPOCH) / 1000) % TOTAL_DURATION;
  let acc = 0;
  for (let i = 0; i < playlist.length; i++) {
    if (pos < acc + playlist[i].duration) {
      return { track: playlist[i], next: playlist[(i + 1) % playlist.length], position: pos - acc };
    }
    acc += playlist[i].duration;
  }
  return { track: playlist[0], next: playlist[1], position: 0 };
}

// =====================
// المستمعون حسب الدولة
// =====================
function CountryStats({ onlineUsers }) {
  const stats = useMemo(() => {
    const counts = onlineUsers.reduce((acc, u) => {
      const c = /^[A-Z]{2}$/.test(u.countryCode || '') ? u.countryCode : 'XX';
      acc[c] = (acc[c] || 0) + 1;
      return acc;
    }, {});
    return Object.entries(counts).map(([code, count]) => ({ code, count })).sort((a, b) => b.count - a.count);
  }, [onlineUsers]);

  if (!stats.length) return null;
  return (
    <div className="absolute top-12 left-4 bg-black/30 backdrop-blur text-white text-xs p-2 rounded-xl z-10 border border-white/10">
      <ul className="space-y-1">
        {stats.slice(0, 4).map(({ code, count }) => (
          <li key={code} className="flex items-center justify-between gap-2">
            <span className="font-bold">{count}</span>
            {code === 'XX' ? <span>🌐</span> :
              <img src={`https://flagcdn.com/w20/${code.toLowerCase()}.png`} width="20" alt={code} className="rounded-sm" />}
          </li>
        ))}
      </ul>
    </div>
  );
}

function TotalStats() {
  const [stats, setStats] = useState({ total_visits: 0, total_listeners: 0 });
  useEffect(() => {
    const ref = database.ref('/stats');
    const l = ref.on('value', snap => {
      const d = snap.val();
      if (d) setStats({ total_visits: d.total_visits || 0, total_listeners: d.total_listeners || 0 });
    });
    return () => ref.off('value', l);
  }, []);
  const fmt = n => n >= 1000000 ? (n / 1000000).toFixed(1) + 'م' : n >= 1000 ? (n / 1000).toFixed(1) + 'ألف' : n;
  return (
    <div className="absolute top-4 right-4 bg-black/30 backdrop-blur text-white text-xs px-3 py-2 rounded-xl z-10 border border-white/10 text-center">
      <div className="flex items-center gap-3">
        <div>
          <p className="font-bold text-sm">{fmt(stats.total_visits)}</p>
          <p className="text-purple-300 text-xs">زيارات</p>
        </div>
        <div className="w-px h-6 bg-white/20"></div>
        <div>
          <p className="font-bold text-sm">{fmt(stats.total_listeners)}</p>
          <p className="text-purple-300 text-xs">مستمعين</p>
        </div>
      </div>
    </div>
  );
}

// =====================
// تسجيل الحضور
// كل زائر يسجّل نفسه فقط، ويُحذف تلقائيًا من الخادم عند انقطاع اتصاله
// =====================
function usePresence() {
  const [users, setUsers] = useState([]);

  useEffect(() => {
    let myRef = null;
    let code = null;
    let connected = false;
    let disposed = false;

    const register = () => {
      if (disposed || !connected || !code || myRef) return;
      const ref = database.ref('/status').push();
      myRef = ref;
      ref.onDisconnect().remove()
        .then(() => ref.set({ countryCode: code, since: firebase.database.ServerValue.TIMESTAMP }))
        .catch(console.error);
    };

    getCountryCode().then(c => { code = c; register(); });

    const connRef = database.ref('.info/connected');
    const onConn = connRef.on('value', snap => {
      connected = snap.val() === true;
      // عند انقطاع الاتصال يحذف الخادم السجل القديم، وعند العودة يُسجَّل من جديد
      if (!connected) { myRef = null; return; }
      register();
    });

    const statusRef = database.ref('/status');
    const onStatus = statusRef.on('value', snap => {
      const list = [];
      snap.forEach(child => { const v = child.val(); if (v) list.push(v); });
      setUsers(list);
    });

    return () => {
      disposed = true;
      connRef.off('value', onConn);
      statusRef.off('value', onStatus);
      if (myRef) myRef.remove().catch(() => {});
    };
  }, []);

  return users;
}

// =====================
// التطبيق الرئيسي
// =====================
const STATUS_TEXT = {
  loading: 'جارٍ تجهيز البث...',
  next: 'جارٍ الانتقال إلى اللقاء التالي...',
  blocked: 'توقف البث، اضغط زر التشغيل للمتابعة',
  error: 'تعذّر تشغيل الصوت، ستُعاد المحاولة تلقائيًا',
};

function App() {
  const audioRef = useRef(null);
  const wantPlayRef = useRef(false);     // هل يريد المستخدم الاستماع الآن
  const trackIdRef = useRef(null);       // اللقاء المحمّل حاليًا في المشغّل
  const statusRef = useRef('idle');
  const endedRef = useRef(false);
  const pendingSeekRef = useRef(false);
  const lastProgressRef = useRef(0);
  const lastAttemptRef = useRef(0);

  const [initial] = useState(() => getRadioState());
  const [isPlaying, setIsPlaying] = useState(false);
  const [status, setStatus] = useState('idle');
  const [track, setTrack] = useState(initial.track);
  const [nextTrack, setNextTrack] = useState(initial.next);
  const [currentTime, setCurrentTime] = useState(initial.position);
  const [volume, setVolume] = useState(() => {
    const v = parseFloat(storage.get('radio_volume'));
    return isNaN(v) ? 0.7 : Math.min(1, Math.max(0, v));
  });

  const onlineUsers = usePresence();

  const updateStatus = useCallback((s) => {
    statusRef.current = s;
    setStatus(s);
  }, []);

  // الإحصائيات الكلية
  useEffect(() => {
    const statsRef = database.ref('/stats');
    statsRef.child('total_visits').set(firebase.database.ServerValue.increment(1)).catch(() => {});
    if (!storage.get('hasVisitedRadio')) {
      statsRef.child('total_listeners').set(firebase.database.ServerValue.increment(1)).catch(() => {});
      storage.set('hasVisitedRadio', 'true');
    }
  }, []);

  // ضبط المشغّل على موضع البث الحي ثم التشغيل
  const syncAndPlay = useCallback((forceReload = false) => {
    const audio = audioRef.current;
    if (!audio) return;
    const s = getRadioState();
    setTrack(s.track);
    setNextTrack(s.next);
    endedRef.current = false;
    lastAttemptRef.current = Date.now();
    lastProgressRef.current = Date.now();
    updateStatus('loading');

    if (forceReload || trackIdRef.current !== s.track.id) {
      trackIdRef.current = s.track.id;
      pendingSeekRef.current = true;
      audio.src = mediaUrl(s.track.id);
      audio.load();
    } else if (audio.readyState >= 1) {
      audio.currentTime = s.position;
    } else {
      pendingSeekRef.current = true;
    }

    const p = audio.play();
    if (p && p.catch) {
      p.catch(err => {
        if (!wantPlayRef.current) return;
        const name = err && err.name;
        if (name === 'AbortError') return; // تغيّر المصدر أثناء التحميل
        updateStatus(name === 'NotAllowedError' ? 'blocked' : 'error');
      });
    }
  }, [updateStatus]);

  const start = useCallback(() => {
    wantPlayRef.current = true;
    setIsPlaying(true);
    syncAndPlay();
    logEvent('playback_started');
  }, [syncAndPlay]);

  const stop = useCallback(() => {
    wantPlayRef.current = false;
    setIsPlaying(false);
    updateStatus('idle');
    if (audioRef.current) audioRef.current.pause();
    logEvent('playback_stopped');
  }, [updateStatus]);

  const togglePlay = () => {
    if (isPlaying && statusRef.current === 'blocked') return syncAndPlay();
    if (isPlaying) stop(); else start();
  };

  // أحداث المشغّل
  useEffect(() => {
    const audio = audioRef.current;
    audio.volume = volume;

    const onTime = () => {
      lastProgressRef.current = Date.now();
      setCurrentTime(audio.currentTime);
    };
    const onPlaying = () => { if (wantPlayRef.current) updateStatus('playing'); };
    const onWaiting = () => { if (wantPlayRef.current && statusRef.current !== 'next') updateStatus('loading'); };
    const onMeta = () => {
      if (!pendingSeekRef.current) return;
      pendingSeekRef.current = false;
      const s = getRadioState();
      if (s.track.id === trackIdRef.current) audio.currentTime = s.position;
    };
    const onEnded = () => {
      if (!wantPlayRef.current) return;
      const s = getRadioState();
      if (s.track.id !== trackIdRef.current) {
        syncAndPlay();
      } else {
        // انتهى الملف قبل موعده في البث؛ ننتظر بدء اللقاء التالي
        endedRef.current = true;
        updateStatus('next');
      }
    };
    // إيقاف من النظام (مكالمة، تطبيق آخر، شاشة القفل) يُحترم ولا يُستأنف تلقائيًا
    const onPause = () => {
      if (!wantPlayRef.current || audio.ended) return;
      if (Date.now() - lastAttemptRef.current < 1500) return;
      wantPlayRef.current = false;
      setIsPlaying(false);
      updateStatus('idle');
    };
    const onError = () => { if (wantPlayRef.current && audio.getAttribute('src')) updateStatus('error'); };

    audio.addEventListener('timeupdate', onTime);
    audio.addEventListener('playing', onPlaying);
    audio.addEventListener('waiting', onWaiting);
    audio.addEventListener('loadedmetadata', onMeta);
    audio.addEventListener('ended', onEnded);
    audio.addEventListener('pause', onPause);
    audio.addEventListener('error', onError);
    return () => {
      audio.removeEventListener('timeupdate', onTime);
      audio.removeEventListener('playing', onPlaying);
      audio.removeEventListener('waiting', onWaiting);
      audio.removeEventListener('loadedmetadata', onMeta);
      audio.removeEventListener('ended', onEnded);
      audio.removeEventListener('pause', onPause);
      audio.removeEventListener('error', onError);
    };
  }, [syncAndPlay, updateStatus]);

  // المراقب: يعيد المشغّل لموضع البث إذا توقف أو علّق أو تأخر
  useEffect(() => {
    const tick = () => {
      const audio = audioRef.current;
      const s = getRadioState();

      // أثناء الإيقاف: عرض ما يُبث الآن
      if (!wantPlayRef.current) {
        setTrack(s.track);
        setNextTrack(s.next);
        setCurrentTime(s.position);
        return;
      }
      if (!audio) return;

      const sinceAttempt = Date.now() - lastAttemptRef.current;
      const st = statusRef.current;

      if (st === 'blocked') return;
      if (s.track.id !== trackIdRef.current) return syncAndPlay();
      if (endedRef.current) return;
      if (st === 'error') { if (sinceAttempt > 8000) syncAndPlay(true); return; }
      if (audio.paused) { if (sinceAttempt > 6000) syncAndPlay(); return; }
      if (Date.now() - lastProgressRef.current > 15000 && sinceAttempt > 15000) return syncAndPlay(true);
      if (audio.readyState >= 3 && Math.abs(audio.currentTime - s.position) > 15) {
        audio.currentTime = s.position;
      }
    };

    const id = setInterval(tick, 1000);
    const onVisible = () => { if (document.visibilityState === 'visible') tick(); };
    document.addEventListener('visibilitychange', onVisible);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVisible); };
  }, [syncAndPlay]);

  // شاشة القفل وأزرار التحكم الخارجية
  useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title,
        artist: 'راديو وليستعفف',
        album: 'بث مباشر',
      });
    } catch (e) {}
  }, [track.id]);

  useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    const set = (action, handler) => {
      try { navigator.mediaSession.setActionHandler(action, handler); } catch (e) {}
    };
    set('play', () => start());
    set('pause', () => stop());
    set('stop', () => stop());
    ['seekbackward', 'seekforward', 'seekto', 'previoustrack', 'nexttrack'].forEach(a => set(a, null));
  }, [start, stop]);

  useEffect(() => {
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused'; } catch (e) {}
    }
  }, [isPlaying]);

  const handleVolume = (e) => {
    const v = parseFloat(e.target.value);
    setVolume(v);
    if (audioRef.current) audioRef.current.volume = v;
    storage.set('radio_volume', String(v));
  };

  const fmt = s => isNaN(s) ? '0:00' : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const progress = Math.min(100, (currentTime / track.duration) * 100 || 0);
  const busy = isPlaying && (status === 'loading' || status === 'next');
  const showPause = isPlaying && status !== 'blocked';

  return (
    <div className="app-h flex flex-col items-center justify-center px-4 pt-16 pb-4 relative overflow-hidden select-none"
         style={{ background: 'linear-gradient(135deg, #1a0533 0%, #0d1b4b 50%, #0a1628 100%)' }}
         onContextMenu={e => e.preventDefault()}>
      <Stars />

      <Listeners onlineCount={onlineUsers.length} />
      <CountryStats onlineUsers={onlineUsers} />
      <TotalStats />

      <audio ref={audioRef} preload="none" controlsList="nodownload" />

      <div className="relative z-10 w-full max-w-sm">
        <div className="absolute inset-0 bg-purple-600/20 rounded-3xl blur-2xl transform scale-110"></div>
        <div className="relative bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-6 text-center shadow-2xl">

          <div className="mb-4">
            <h1 className="text-white text-2xl font-extrabold tracking-wide">راديو وليستعفف</h1>
            <div className="flex items-center justify-center gap-1 mt-1">
              <span className="w-1.5 h-1.5 bg-red-400 rounded-full pulse-dot"></span>
              <span className="text-red-400 text-xs font-medium">بث مباشر</span>
            </div>
          </div>

          <div className="bg-white/5 rounded-2xl p-3 mb-4 border border-white/10">
            <p className="text-white font-bold text-sm leading-relaxed">{track.title}</p>
            {nextTrack && (
              <p className="text-white/40 text-xs mt-1">التالي: {nextTrack.title}</p>
            )}
          </div>

          <button
            onClick={togglePlay}
            aria-label={showPause ? 'إيقاف البث' : 'تشغيل البث'}
            className={`rounded-full flex items-center justify-center mx-auto mb-3 text-3xl transition-all duration-300 bg-white text-purple-900 ${showPause && !busy ? 'play-btn-glow' : 'hover:scale-105'}`}
            style={{ width: '72px', height: '72px' }}
          >
            {busy ? <span className="spinner"></span> : (showPause ? '⏸' : '▶')}
          </button>

          <div className="min-h-[20px] mb-3">
            {isPlaying && STATUS_TEXT[status] && (
              <p className={`text-xs ${status === 'error' || status === 'blocked' ? 'text-pink-300' : 'text-white/50'}`}>
                {STATUS_TEXT[status]}
              </p>
            )}
            {!isPlaying && (
              <p className="text-white/40 text-xs">اضغط للاستماع إلى البث المباشر</p>
            )}
            {isPlaying && status === 'error' && (
              <button
                onClick={() => syncAndPlay(true)}
                className="mt-2 text-xs text-white bg-white/10 hover:bg-white/20 border border-white/20 px-3 py-1 rounded-lg transition-colors"
              >
                إعادة المحاولة
              </button>
            )}
          </div>

          <div className="mb-3">
            <div className="flex justify-between text-xs text-white/40 mb-1">
              <span>{fmt(currentTime)}</span>
              <span>{fmt(track.duration)}</span>
            </div>
            <div className="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
              <div className="h-full rounded-full transition-all duration-1000"
                style={{ width: `${progress}%`, background: 'linear-gradient(90deg, #a855f7, #ec4899)' }} />
            </div>
          </div>

          {!IS_IOS && (
            <input type="range" min="0" max="1" step="0.01" value={volume}
              onChange={handleVolume} aria-label="مستوى الصوت"
              className="w-full accent-purple-500 mb-4" />
          )}

          <div className="flex justify-center">
            <a href="https://www.facebook.com/groups/1594701261071238" target="_blank" rel="noopener noreferrer"
              aria-label="مجموعة فيسبوك"
              className="flex items-center justify-center bg-white/10 hover:bg-white/20 border border-white/20 text-white w-10 h-10 rounded-xl transition-all">
              <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path fillRule="evenodd" d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" clipRule="evenodd"/>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
